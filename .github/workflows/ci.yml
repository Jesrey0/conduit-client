name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r client/requirements.txt
      - run: python -m unittest discover -s client/tests
      - run: python -m unittest discover -s tests
      - run: sha256sum -c SHA256SUMS.txt
      - run: python -m py_compile client/conduit_admission.py client/conduit_cli.py candidate/conduit_candidate.py
